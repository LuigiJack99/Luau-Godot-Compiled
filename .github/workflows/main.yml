name: Build Luau-Godot Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download dependencies manually
      run: |
        mkdir -p extern/godot-cpp extern/luau
        echo "Downloading godot-cpp..."
        curl -L https://github.com/godotengine/godot-cpp/archive/refs/tags/4.6-stable.tar.gz | tar xz --strip-components=1 -C extern/godot-cpp
        echo "Downloading luau..."
        curl -L https://github.com/Roblox/luau/archive/refs/heads/main.tar.gz | tar xz --strip-components=1 -C extern/luau

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install SCons
      run: |
        python -m pip install --upgrade pip
        pip install scons

    - name: Compile Extension for Linux
      run: |
        scons target=template_debug platform=linux arch=x86_64

    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: compiled-binaries
        path: |
          bin/
          luau.gdextension
          icons/

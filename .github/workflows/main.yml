name: Build Luau-Godot Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone dependencies cleanly
      run: |
        rm -rf extern/godot-cpp extern/luau
        mkdir -p extern
        # Clone latest default godot-cpp and luau repositories
        git clone --depth 1 https://github.com/godotengine/godot-cpp.git extern/godot-cpp
        git clone --recursive --depth 1 https://github.com/Roblox/luau.git extern/luau

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install SCons
      run: |
        python -m pip install --upgrade pip
        pip install scons

    - name: Compile Extension for Linux (Targeting Godot 4.6)
      run: |
        scons target=template_debug platform=linux arch=x86_64 api_version=4.6

    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: compiled-binaries
        path: |
          bin/
          luau.gdextension
          icons/

name: Build Luau For Godot Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone dependencies correctly
      run: |
        rm -rf extern/godot-cpp extern/luau
        mkdir -p extern
        # Clone godot-cpp matching stable 4.x api headers
        git clone --depth 1 -b 4.5-stable https://github.com/godotengine/godot-cpp.git extern/godot-cpp
        # Clone Luau recursively so internal files/submodules aren't missing
        git clone --recursive --depth 1 https://github.com/Roblox/luau.git extern/luau

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install SCons
      run: |
        python -m pip install --upgrade pip
        pip install scons

    - name: Compile Extension for Linux
      run: |
        scons target=template_debug platform=linux arch=x86_64

    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: compiled-binaries
        path: |
          bin/
          luau.gdextension
          icons/
